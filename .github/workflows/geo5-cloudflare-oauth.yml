name: Geo5 Cloudflare OAuth deploy
# production deployment with puzzle-pool, PLACE maps and social-card verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geo5-cloudflare-oauth.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: geo5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and test
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check
      - name: Authorize Cloudflare, deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_LOG="$RUNNER_TEMP/wrangler-device.log"
          CLEAN_LOG="$RUNNER_TEMP/wrangler-device-clean.log"
          env -u CI TERM=xterm script -q -f -c "npx --yes wrangler@latest login --device --browser=false" "$LOGIN_LOG" >/dev/null 2>&1 &
          LOGIN_PID=$!

          for i in $(seq 1 45); do
            sed -r 's/\x1B\[[0-9;]*[mK]//g' "$LOGIN_LOG" 2>/dev/null | tr -d '\r' > "$CLEAN_LOG" || true
            if grep -q 'dash.cloudflare.com/oauth2/device/verify' "$CLEAN_LOG"; then
              break
            fi
            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              cat "$CLEAN_LOG" >&2
              exit 1
            fi
            sleep 1
          done

          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$LOGIN_LOG" | tr -d '\r' > "$CLEAN_LOG"
          DEVICE_URL=$(grep -oE 'https://dash\.cloudflare\.com/oauth2/device/verify' "$CLEAN_LOG" | tail -1 || true)
          DEVICE_CODE=$(awk '/enter the code:/{f=1;next} f && $0 ~ /[[:alnum:]]/{gsub(/[^A-Za-z0-9]/,""); print; exit}' "$CLEAN_LOG")
          test -n "$DEVICE_URL"
          test -n "$DEVICE_CODE"

          printf '%s\n%s\n' "$DEVICE_URL" "$DEVICE_CODE" > "$RUNNER_TEMP/device.txt"
          openssl pkeyutl -encrypt -pubin \
            -inkey .cloudflare-device-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/device.txt" -out "$RUNNER_TEMP/device.enc"
          base64 -w0 "$RUNNER_TEMP/device.enc" > "$RUNNER_TEMP/device.cipher"
          rm -f "$RUNNER_TEMP/device.txt"

          git config user.name 'Geo5 deployment bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/device.cipher" .cloudflare-device-cipher.txt
          git add .cloudflare-device-cipher.txt
          git commit -m 'Publish encrypted Cloudflare device authorization' || true
          git push origin HEAD:main

          wait "$LOGIN_PID"
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest deploy --config wrangler.jsonc

          for i in $(seq 1 30); do
            ROOT=$(curl -sSL -o "$RUNNER_TEMP/root" -w '%{http_code}' --max-time 15 https://geo5.pm4gis.nz/ || true)
            API=$(curl -sSL -o "$RUNNER_TEMP/api" -w '%{http_code}' --max-time 15 'https://geo5.pm4gis.nz/api/puzzle?mode=gis&attempts=0' || true)
            PLACE=$(curl -sSL -o "$RUNNER_TEMP/place" -w '%{http_code}' --max-time 15 https://geo5.pm4gis.nz/place || true)
            APPJS=$(curl -sSL -o "$RUNNER_TEMP/appjs" -w '%{http_code}' --max-time 15 https://geo5.pm4gis.nz/app.js || true)
            GISOG=$(curl -sSL -D "$RUNNER_TEMP/gisog.headers" -o "$RUNNER_TEMP/gisog" -w '%{http_code}' --max-time 15 https://geo5.pm4gis.nz/og-gis.jpg || true)
            PLACEOG=$(curl -sSL -D "$RUNNER_TEMP/placeog.headers" -o "$RUNNER_TEMP/placeog" -w '%{http_code}' --max-time 15 https://geo5.pm4gis.nz/og-place.jpg || true)
            if [ "$ROOT" = 200 ] && [ "$API" = 200 ] && [ "$PLACE" = 200 ] && [ "$APPJS" = 200 ] && [ "$GISOG" = 200 ] && [ "$PLACEOG" = 200 ]; then
              grep -q 'Geo5' "$RUNNER_TEMP/root"
              grep -q 'og-gis.jpg' "$RUNNER_TEMP/root"
              grep -q '"mode":"gis"' "$RUNNER_TEMP/api"
              grep -q '"total":150' "$RUNNER_TEMP/api"
              grep -q 'PLACE' "$RUNNER_TEMP/place"
              grep -q 'mapPlace' "$RUNNER_TEMP/place"
              grep -q 'Open in Google Maps' "$RUNNER_TEMP/place"
              grep -q 'og-place.jpg' "$RUNNER_TEMP/place"
              grep -q "Copied for sharing" "$RUNNER_TEMP/appjs"
              grep -q 'google.com/maps/search' "$RUNNER_TEMP/appjs"
              ! grep -q 'navigator.share' "$RUNNER_TEMP/appjs"
              grep -qi '^content-type: image/jpeg' "$RUNNER_TEMP/gisog.headers"
              grep -qi '^content-type: image/jpeg' "$RUNNER_TEMP/placeog.headers"
              file "$RUNNER_TEMP/gisog" | grep -q '1200x630'
              file "$RUNNER_TEMP/placeog" | grep -q '1200x630'
              echo 'GEO5_150_PUZZLES_PLACE_MAPS_AND_SOCIAL_CARDS_VERIFIED'
              exit 0
            fi
            echo "Waiting for Geo5: root=$ROOT api=$API place=$PLACE appjs=$APPJS gisog=$GISOG placeog=$PLACEOG"
            sleep 5
          done

          echo 'Geo5 verification timed out.' >&2
          exit 1
