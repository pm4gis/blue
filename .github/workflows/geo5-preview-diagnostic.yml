name: Geo5 preview diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geo5-preview-diagnostic.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check temporary Geo5 preview
        shell: bash
        run: |
          set +e
          URL='https://geo5.western-effect.workers.dev'
          echo '=== ROOT ==='
          curl -sS --max-redirs 0 -D /tmp/root.h -o /tmp/root.b "$URL/"
          sed -n '1,20p' /tmp/root.h
          echo 'BODY:'
          head -c 300 /tmp/root.b; echo
          echo '=== API ==='
          curl -sS --max-redirs 0 -D /tmp/api.h -o /tmp/api.b "$URL/api/puzzle?mode=gis&attempts=0"
          sed -n '1,20p' /tmp/api.h
          echo 'BODY:'
          head -c 500 /tmp/api.b; echo
          echo '=== PLACE ==='
          curl -sS --max-redirs 0 -D /tmp/place.h -o /tmp/place.b "$URL/place"
          sed -n '1,20p' /tmp/place.h
          echo 'BODY:'
          head -c 300 /tmp/place.b; echo
