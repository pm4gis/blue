name: Geo5 place candidates

on:
  push:
    paths:
      - '.github/workflows/geo5-place-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch LINZ Gazetteer candidates
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const base='https://services.arcgis.com/xdsHIIxuCWByZiCB/ArcGIS/rest/services/LINZ_NZ_Place_Names/FeatureServer/0/query';
          const out=[];
          for(let offset=0;;offset+=2000){
            const u=new URL(base);
            u.searchParams.set('where','crd_latitude > -60 AND crd_latitude < -25');
            u.searchParams.set('outFields','name,name_id,status,feat_type,crd_latitude,crd_longitude,label_hierarchy,territorial_authority');
            u.searchParams.set('returnGeometry','false');
            u.searchParams.set('resultOffset',String(offset));
            u.searchParams.set('resultRecordCount','2000');
            u.searchParams.set('orderByFields','OBJECTID');
            u.searchParams.set('f','json');
            const r=await fetch(u);
            if(!r.ok) throw new Error(`LINZ HTTP ${r.status}`);
            const j=await r.json();
            if(j.error) throw new Error(JSON.stringify(j.error));
            const rows=(j.features||[]).map(f=>f.attributes);
            out.push(...rows);
            if(rows.length<2000) break;
          }
          const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z]/g,'');
          const priority=new Map([
            ['Town',0],['City',0],['Locality',1],['Suburb',1],['Village',1],
            ['Island',2],['Lake',2],['Bay',3],['Harbour',3],['River',3],['Stream',4],
            ['Pass',4],['Valley',4],['Hill',4],['Peak',4],['Point',4],['Beach',4],['Reserve',5]
          ]);
          const five=out.filter(x=>norm(x.name).length===5 && /^[A-Za-zĀĒĪŌŪāēīōū'’ -]+$/u.test(x.name||''));
          const best=new Map();
          for(const x of five){
            const n=norm(x.name);
            const rank=priority.get(x.feat_type) ?? 9;
            const official=/official/i.test(x.status||'')?0:1;
            const label=Number.parseFloat(x.label_hierarchy);
            const score=[rank,official,Number.isFinite(label)?label:9999,x.name.length];
            const prev=best.get(n);
            if(!prev || score.join('|')<prev._score.join('|')) best.set(n,{...x,norm:n,_score:score});
          }
          const rows=[...best.values()].sort((a,b)=>{
            for(let i=0;i<a._score.length;i++){const d=a._score[i]-b._score[i];if(d)return d;}
            return a.name.localeCompare(b.name,'en-NZ');
          }).map(({_score,...x})=>x);
          fs.writeFileSync('geo5-place-candidates.json',JSON.stringify({count:rows.length,rows},null,2));
          console.log(`Fetched ${out.length} Gazetteer rows; ${rows.length} unique five-letter candidates.`);
          console.log('Feature types:',[...new Set(rows.map(x=>x.feat_type))].sort().join(', '));
          console.log('Top 150:',rows.slice(0,150).map(x=>`${x.name} [${x.feat_type}; ${x.status}; h=${x.label_hierarchy}]`).join('\n'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: geo5-place-candidates
          path: geo5-place-candidates.json
          retention-days: 1
