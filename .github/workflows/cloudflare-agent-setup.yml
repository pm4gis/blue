name: Install Cloudflare agent skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-agent-setup.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install official Cloudflare skills
        run: |
          set -euo pipefail
          npx -y skills add cloudflare/skills --skill '*' --yes --global
      - name: Persist skills in repository
        run: |
          set -euo pipefail
          mkdir -p .github/skills
          copied=0
          for root in "$HOME/.agents/skills" "$HOME/.copilot/skills" "$HOME/.codex/skills" "$HOME/.claude/skills"; do
            if [ -d "$root" ]; then
              cp -a "$root/." .github/skills/
              copied=1
            fi
          done
          if [ "$copied" -ne 1 ]; then
            echo 'No installed skills directory found.' >&2
            find "$HOME" -maxdepth 4 -name SKILL.md -print || true
            exit 1
          fi
          count=$(find .github/skills -name SKILL.md | wc -l)
          echo "Cloudflare skills persisted: $count"
          test "$count" -gt 0
      - name: Commit skills and remove one-off installer
        run: |
          set -euo pipefail
          git config user.name 'Cloudflare agent setup'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/skills
          git rm .github/workflows/cloudflare-agent-setup.yml
          git commit -m 'Install official Cloudflare agent skills'
          git pull --rebase origin main
          git push origin HEAD:main
