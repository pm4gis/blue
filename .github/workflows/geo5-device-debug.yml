name: Geo5 Cloudflare device prompt diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/geo5-device-debug.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: geo5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture encrypted Wrangler device prompt
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/device.log"
          CLEAN="$RUNNER_TEMP/device-clean.log"
          timeout 8s script -q -c "npx --yes wrangler@latest login --device --browser=false" "$LOG" || true
          sed -r 's/\x1B\[[0-9;]*[mK]//g' "$LOG" > "$CLEAN" || true
          PASS=$(openssl rand -hex 32)
          printf '%s' "$PASS" > "$RUNNER_TEMP/pass.txt"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:"$RUNNER_TEMP/pass.txt" -in "$CLEAN" -out "$RUNNER_TEMP/device-log.enc"
          openssl pkeyutl -encrypt -pubin \
            -inkey .cloudflare-device-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in "$RUNNER_TEMP/pass.txt" -out "$RUNNER_TEMP/pass.enc"
          base64 -w0 "$RUNNER_TEMP/device-log.enc" > .cloudflare-debug-log.b64
          base64 -w0 "$RUNNER_TEMP/pass.enc" > .cloudflare-debug-key.b64
          git config user.name 'Geo5 deployment bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .cloudflare-debug-log.b64 .cloudflare-debug-key.b64
          git commit -m 'Publish encrypted Cloudflare device prompt diagnostic'
          git push origin HEAD:main
